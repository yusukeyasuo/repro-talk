name: Deploy to production

# 本番デプロイはこのワークフローが一元管理する（Vercel の main 自動デプロイは
# vercel.json の git.deploymentEnabled で無効化している）。
# 順序を保証する: DB マイグレーション成功 → そのあとで Vercel をトリガー。
# マイグレーションが失敗したら以降のステップは走らず、アプリはデプロイされない（fail-safe）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 本番デプロイは直列化（同時走行を避ける）。マイグレーション中に別実行を割り込ませない。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # 本番プロジェクト ref（URL に出る値。秘匿情報ではないので直書き）
      SUPABASE_PROJECT_ID: dztpvtauwsplqwsmmell
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # 未適用のマイグレーションだけ適用（無ければ no-op で即終了）。
      - name: Push migrations
        run: supabase db push

      # マイグレーション成功後にだけ Vercel 本番デプロイをトリガーする。
      # -f: HTTP エラーで失敗扱いにする。フック URL は Vercel の Deploy Hook。
      - name: Trigger Vercel production deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
