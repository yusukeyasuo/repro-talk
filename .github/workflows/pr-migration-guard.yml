# スマホ完結の運用（docs/mobile-dev-workflow.md の案A）を支える見張り番。
#
# プレビュー環境は本番 Supabase を共有していて、マイグレーションは main への push 後に
# しか本番DBへ当たらない。そのため supabase/migrations/ を含む PR は
# 「プレビューを開いても新しい列が無くて動かない」状態になる。
# 差分を精読できないスマホの上でそれに気づくのは無理なので、PR 自身に言わせる。
#
# あえて失敗（赤）にはしない。マイグレーション入り PR もマージはする。ただし
# 「スマホで完結させてはいけない」という判断材料をラベルとコメントで残す。
# のちに auto-merge を入れるときは、このラベルを除外条件に使う。
name: PR migration guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      LABEL: migration
      MARKER: '<!-- migration-guard -->'
      BODY_FILE: .github/migration-guard-comment.md
    steps:
      # コメント本文だけ欲しいので浅く取る。差分は gh pr diff で API から取るため
      # 全履歴は不要。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/migration-guard-comment.md
          sparse-checkout-cone-mode: false

      - name: Detect migration changes
        id: detect
        run: |
          if gh pr diff "$PR" --name-only | grep -q '^supabase/migrations/'; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure label exists
        if: steps.detect.outputs.found == 'true'
        run: |
          gh label create "$LABEL" \
            --color D93F0B \
            --description 'スキーマ変更を含む。プレビューで検証できないのでスマホ完結の対象外' \
            2>/dev/null || true

      - name: Add label
        if: steps.detect.outputs.found == 'true'
        run: gh pr edit "$PR" --add-label "$LABEL"

      # push のたびに同じ警告を積まない。マーカー付きコメントが既にあれば何もしない。
      - name: Comment once
        if: steps.detect.outputs.found == 'true'
        run: |
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo 'すでに警告済み。何もしない。'
            exit 0
          fi
          gh pr comment "$PR" --body-file "$BODY_FILE"

      # マイグレーションを取り下げた場合はラベルも下ろす（古い警告を残さない）。
      - name: Remove label when no longer applicable
        if: steps.detect.outputs.found == 'false'
        run: gh pr edit "$PR" --remove-label "$LABEL" 2>/dev/null || true
